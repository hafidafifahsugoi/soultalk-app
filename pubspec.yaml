name: soultalk_ai
description: SoulTalk AI - Your AI Mental Wellness Companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0
  google_generative_ai: ^0.4.0
  http: ^1.2.0
  camera: ^0.12.0+2
  permission_handler: 11.3.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/moods/
